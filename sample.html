<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="css/grid.css" rel="stylesheet" type="text/css">
    <link href="css/main.css" rel="stylesheet" type="text/css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
    <title>Music Mixer</title>
</head>
<body>
    <header class="grid-con centered">
        <h1 class="col-span-full">The Music Mixer Project</h1>    
    </header>
    
    <main class="grid-con centered">
        <section class="grid-con col-span-full">
            <h2 class="col-span-full">Music Mixer Area</h2>
            <div id="song" class="box height-1 col-span-1 m-col-span-2">

            </div>

            <div id="mixer" class="box height-1 col-span-3 m-col-span-4">

            </div>


        </section>

        <section class="grid-con col-span-full">
            <h2 class="col-span-full">Audio Tray</h2>
            <audio src="audio/music-1.mp3" id="music-audio" loop></audio>
            <div id="tray" class="box height-1 col-span-full m-col-span-6">
                <div draggable="true" id="music-1" data-audio="music-1.mp3" data-audio-type="song" class="audio-icon"></div>            
                <div draggable="true" id="music-3" data-audio="music-3.mp3" data-audio-type="song"  class="audio-icon"></div>      
                <div draggable="true" id="music-4" data-audio="music-4.mp3" data-audio-type="song" class="audio-icon"></div>  
                <div draggable="true" id="music-5" data-audio="music-5.mp3" data-audio-type="song" class="audio-icon"></div>  

                <div draggable="true" id="dolphin" data-audio="dolphin.mp3" data-audio-type="sound" class="audio-icon"></div>  
                <div draggable="true" id="ship" data-audio="polar_bear.mp3" data-audio-type="sound" class="audio-icon"></div>  
            </div>

        </section>   
        
        <section class="grid-con col-span-full" id="audio-controls">
            <button id="play-btn" class="audio-btn"></button>
            <button id="stop-btn" class="audio-btn"></button>
            <button id="rewind-btn" class="audio-btn"></button>
        </section>
    </main>



    <script src="js/main.js"></script>
</body>


</html>
