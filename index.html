    <title>Pirate Music Mixer - Ahoy Matey!</title>
</head>
<body>
    <div id="main-container">
        <section id="main-box">
            <h1>Pirate Music Mixer</h1>
            <p>Drag and Create your swashbucklin’ band, matey!</p>
            <div id="game-area">
                <div id="sea-bg">
                    <div id="drop-area">
                        <div class="drop-zone spot"></div>
                        <div id="main-dj-dz" class="spot">
							<object id="main-dj" data="images/octo.svg" type="image/svg+xml"></object>
						</div>
                        <div class="drop-zone spot"></div>
                        <div class="drop-zone spot"></div>
                        <div class="drop-zone spot"></div>
                    </div>
                    <div id="control-deck">
                        <div id="main-board">
                            <object id="board-paper" data="images/scroll.svg" type="image/svg+xml"></object>
                            <div id="icon-con">
                                <span draggable="true" data-audio="seal.mp3" class="band icon" id="seal"></span>
								<span draggable="true" data-audio="dolphin.mp3" class="band icon" id="pink-dolphin"></span>
								<span draggable="true" data-audio="ship.mp3" class="band icon" id="ship"></span>
								<span draggable="true" data-audio="ship.mp3" class="band icon" id="seagull"></span>
								<span draggable="true" data-audio="ship.mp3" class="band icon" id="otter"></span>
								<span draggable="true" data-audio="ship.mp3" class="band icon" id="conch"></span>
								<span draggable="true" data-audio="ship.mp3" class="band icon" id="whale"></span>
								<span draggable="true" data-audio="ship.mp3" class="band icon" id="piccolo"></span>
								<span draggable="true" data-audio="ship.mp3" class="band icon" id="saxophone"></span>
								<span draggable="true" data-audio="ship.mp3" class="band icon" id="accordion"></span>
								<span draggable="true" data-audio="ship.mp3" class="band icon" id="violin"></span>
                            </div>
                        </div>

                        <div class="audio-ctrl">
                            <button id="play-btn">
								<svg viewBox="0 0 180.7 182.6" xmlns="http://www.w3.org/2000/svg">
									<use href="#play-btn-svg"/>
								</svg>
                            </button>
                        </div>

                        <div class="audio-ctrl">
                            <button id="rew-btn">
                                <object class="audio-icon" data="images/btn_fastbackward2.svg" type="image/svg+xml"></object>     
                            </button>
							<label class="hidden" for="vol-slider">Volume</label>
							<div id="volume-con">
								<!--<object data="images/volume-slider.svg" type="image/svg+xml"></object>-->
								<svg viewBox="0 0 246.3 50" xmlns="http://www.w3.org/2000/svg">
									<use href="#volume-slider-svg"/>
								</svg>
                           		<input id="vol-slider" type="range" min="0" max="100">							

							</div>


                        </div>
                    </div>
                </div>
            </div>
        </section>    

        <div id="sidebar">
            <h2 class="hidden">Pirate Log</h2>
             
        </div>    
    </div>
