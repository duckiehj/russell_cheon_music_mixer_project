<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="css/grid.css" rel="stylesheet" type="text/css">
    <link href="css/main.css" rel="stylesheet" type="text/css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
    <title>Pirate Music Mixer - Ahoy Matey!</title>
</head>
<body>
    <div id="main-container">
        <section id="main-box">
			<h1 class="hidden">Yarr! It be time to mix the shanties.</h1>
            
			<div id="game-area-frame">
				<div id="game-area">
					<div id="sea-bg">
						<div id="drop-area">
							<div class="drop-zone spot"></div>
							<div id="main-dj-dz" class="spot">
								<object id="main-dj" data="images/octo.svg" type="image/svg+xml"></object>
								<div id="music-dz" class="instrument"></div>
							</div>
							<div class="drop-zone spot"></div>
							<div class="drop-zone spot"></div>
							<div class="drop-zone spot"></div>
						</div>
						<div id="control-deck">
							<div id="main-board">
								<object id="board-paper" data="images/scroll.svg" type="image/svg+xml"></object>
								<div id="icon-con">
									<span draggable="true" data-audio="seal.mp3" class="dragunit band icon no-display" id="seal"></span>
									<span draggable="true" data-audio="dolphin.mp3" class="dragunit band icon no-display" id="pink-dolphin"></span>
									<span draggable="true" data-audio="ship.mp3" class="dragunit band icon no-display" id="ship"></span>
									<span draggable="true" data-audio="seagull.mp3" class="dragunit band icon no-display" id="seagull"></span>
									<span draggable="true" data-audio="otter.mp3" class="dragunit band icon no-display" id="otter"></span>
									<span draggable="true" data-audio="conch.mp3" class="dragunit band icon no-display" id="conch"></span>
									<span draggable="true" data-audio="whale.mp3" class="dragunit band icon no-display" id="whale"></span>
									<span draggable="true" data-audio="piccolo.mp3" data-song-name="Wellerman" class="dragunit instrument icon" id="piccolo"></span>
									<span draggable="true" data-audio="saxophone.mp3" data-song-name="Beyond The Sea" class="dragunit instrument icon" id="saxophone"></span>
									<span draggable="true" data-audio="accordion.mp3" data-song-name="What Shall We Do With The Drunken Sailor" class="dragunit instrument icon" id="accordion"></span>
									<span draggable="true" data-audio="violin.mp3" data-song-name="Yo Ho A Pirate Life For Me" class="dragunit instrument icon" id="violin"></span>
								</div>
							</div>

							<div class="audio-ctrl">
								<button id="play-btn">
									<svg viewBox="0 0 180.7 182.6" xmlns="http://www.w3.org/2000/svg">
										<use href="#play-btn-svg"/>
									</svg>
								</button>
							</div>

							<div class="audio-ctrl">
								<button id="rew-btn">
									<object class="audio-icon" data="images/btn_fastbackward2.svg" type="image/svg+xml"></object>     
								</button>
								<label class="hidden" for="vol-slider">Volume</label>
								<div id="volume-con">
									<!--<object data="images/volume-slider.svg" type="image/svg+xml"></object>-->
									<svg viewBox="0 0 246.3 50" xmlns="http://www.w3.org/2000/svg">
										<use href="#volume-slider-svg"/>
									</svg>
									<input id="vol-slider" type="range" min="0" max="100">							

								</div>
								<div id="btn-con" class="hidden">
									<button id="mute-btn">
										<svg class="audio-icon" viewBox="0 0 93.1 94" xmlns="http://www.w3.org/2000/svg">
											<use href="#mute-btn-svg"/>
										</svg>   
									</button>
									<button id="solo-btn">
										<svg class="audio-icon" viewBox="0 0 93.1 94" xmlns="http://www.w3.org/2000/svg">
											<use href="#solo-btn-svg"/>
										</svg>     
									</button>
									<button id="return-btn">
										<object class="audio-icon" data="images/return-button.svg" type="image/svg+xml"></object>     
									</button>
								</div>


							</div>
						</div>
					</div>
				</div>
			</div>
				

        </section>    

        <div id="sidebar">
			<section id="intro">
				<h2>Pirate Music Mixer</h2>
				<p>Drag and Create your swashbucklin’ band, matey!</p>
			</section>
            <p id="speech">Drag an instrument to the Octo DJ to start</p> 
			<img class="bottom-img" src="images/Treasure_chest.svg" alt="a treasure chest">
        </div>    
    </div>
